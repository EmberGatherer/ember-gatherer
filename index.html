<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ember & Gatherer | Smokehouse and Catering</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 40px;
            background: #1e1e1e;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }
        h1 {
            color: #ff5722;
            margin-bottom: 10px;
        }
        p.tagline {
            font-size: 1.2rem;
            color: #b0b0b0;
            margin-bottom: 30px;
        }
        .info-box {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .info-box h3 {
            margin-top: 0;
            color: #ffa726;
        }
        .contacts {
            font-size: 1.1rem;
            line-height: 1.6;
        }
        .contacts a {
            color: #ff5722;
            text-decoration: none;
        }
        .contacts a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Ember & Gatherer</h1>
        <p class="tagline">Smokehouse and Catering</p>
        
        <div class="info-box">
            <h3>Operating Hours</h3>
            <p>Monday – Sunday: 8:00 AM – 6:00 PM</p>
        </div>

        <div class="contacts">
            <h3>Contact Us</h3>
            <p>Phone 1: <a href="tel:+13683992562">+1 (368) 399-2562</a></p>
            <p>Phone 2: <a href="tel:+17808186312">+1 (780) 818-6312</a></p>
        </div>
    </div>
</body>
</html>
